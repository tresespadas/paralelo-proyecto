# values/prometheus.yaml — standalone Prometheus (scope medium)
#
# Scope activo:
#   - server (TSDB + API + UI)
#   - node-exporter (DaemonSet; métricas de SO por nodo)
#   - kube-state-metrics (métricas sobre objetos de la API de k8s)
#
# Scope desactivado (lo dejamos fuera por ruido pedagógico y ahorro de RAM):
#   - alertmanager (sin rutas de salida útiles en el lab)
#   - pushgateway (no tenemos batch jobs que lo necesiten)

server:
  persistentVolume:
    enabled: true
    existingClaim: prometheus-pvc

  # Desactivamos el init container que hace chown al volumen.
  # Ya hicimos el chown a mano (UID 65534) en /mnt/data/prometheus en worker2,
  # y así evitamos depender del pull de busybox desde Docker Hub — mismo fix
  # que aplicamos con Grafana.
  initChownData:
    enabled: false

  service:
    type: NodePort
    nodePort: 30090

  # Anclamos el server a worker2 (mismo nodo que Grafana: concentración
  # de monitoring + hostPath local).
  nodeSelector:
    kubernetes.io/hostname: worker2

  # Retención moderada para el lab; el default es 15d.
  retention: "7d"

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

# Alertmanager: desactivado (no usamos rutas de alerta todavía).
alertmanager:
  enabled: false

# Pushgateway: desactivado (no hay jobs batch en este lab).
prometheus-pushgateway:
  enabled: false

# node-exporter: se queda activado (DaemonSet, corre en los 3 nodos).
# Requests conservadores para no saturar workers con 4GB.
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# kube-state-metrics: se queda activado (expone el estado de la API de k8s).
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

