apiVersion: v1
kind: Service
metadata:
  name: {{ include "webgoat.fullname" . }}
  labels:
    {{- include "webgoat.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # WebGoat principal — expuesto vía NodePort para acceso externo (Kali).
    - port: {{ .Values.service.port }}
      targetPort: webgoat
      nodePort: {{ .Values.service.nodePort }}
      protocol: TCP
      name: webgoat
    # WebWolf — solo expuesto a nivel cluster (sin nodePort declarado).
    # Si type=NodePort y no declaramos nodePort, k8s NO asigna uno para
    # ese puerto a menos que pongas nodePort: 0 explícito. Con type=NodePort
    # k8s asigna uno random igualmente — para mantenerlo INTERNO realmente
    # convendría partirlo en dos Services (uno NodePort, otro ClusterIP).
    # Por simplicidad de momento aceptamos que WebWolf se exponga en un
    # nodePort random — si en algún test queremos contención estricta,
    # cambiamos a dos Services.
    - port: {{ .Values.service.webwolfPort }}
      targetPort: webwolf
      protocol: TCP
      name: webwolf
  selector:
    {{- include "webgoat.selectorLabels" . | nindent 4 }}
